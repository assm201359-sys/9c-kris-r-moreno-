<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menú Principal</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#121212;
    color:#FFFFFF;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.contenedor{
    width:90%;
    max-width:700px;
    text-align:center;
    background:#1E1E1E;
    padding:40px;
    border-radius:15px;
    border:2px solid #00E676;
}

h1{
    color:#00E676;
    margin-bottom:15px;
    font-size:40px;
}

h2{
    margin-bottom:30px;
}

.botones{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

a{
    text-decoration:none;
}

button{
    width:100%;
    padding:15px;
    background:#00E676;
    color:#121212;
    border:none;
    border-radius:10px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#00c853;
    transform:scale(1.05);
}

@media(max-width:600px){

.botones{
    grid-template-columns:1fr;
}

}

</style>

</head>
<body>

<div class="contenedor">

<h1>Kris R</h1>

<h2 id="saludo"></h2>

<div class="botones">

<a href="Juego.html">
<button>🎮 Juego</button>
</a>

<a href="Diario.html">
<button>📖 Diario</button>
</a>

<a href="Tareas.html">
<button>✅ Lista de tareas</button>
</a>

<a href="Perfil.html">
<button>👤 Perfil</button>
</a>

<a href="index.html">
<button>🏠 Inicio</button>
</a>

<a href="Registro.html">
<button>🚪 Cerrar sesión</button>
</a>

</div>

</div>

<script>

let usuario = localStorage.getItem("usuario");

if(usuario == null || usuario == ""){
    usuario = "Invitado";
}

document.getElementById("saludo").innerHTML =
"¡Bienvenido, " + usuario + "!";

</script>

</body>
</html>
